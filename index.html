<html>
    <head>
        <link rel="stylesheet" href="index.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="container">
            <div id="header">
                <h1 id="header-text">Metric/Imperial Unit Conversion</h1>
                <input type="number" id="input-text" min="0" placeholder="0" step="0.001"></input>
                <button class="button" id="convert-btn">Convert</button>
                <button class="button" id="clear-btn">Clear</button>
            </div>
            <div class="conversions">
                <div class="conversion-box" id="conversion-box-one">
                    <h3 class="conversion-title">Length (Meter/Feet)</h3>
                    <p class="conversion-result" id="conversion-one">Please enter value to convert</p>
                </div>
                <div class="conversion-box" id="conversion-box-two">
                    <h3 class="conversion-title">Volume (Liters/Gallons)</h3>
                    <p class="conversion-result" id="conversion-two">Please enter value to convert</p>
                </div>
                <div class="conversion-box" id="conversion-box-three">
                    <h3 class="conversion-title">Mass (Kilograms/Pounds)</h3>
                    <p class="conversion-result"id="conversion-three">Please enter value to convert</p>
                </div>
            </div>
        <div>        
        <script src="index.js"></script>
    </body>
</html>
